{% extends 'base.html' %}

{% block title %}Register - AeroMiles{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-16">
    <div class="bg-white p-8 rounded-lg shadow-lg">
        <h2 class="text-3xl font-bold text-center mb-6">Registrasi</h2>

        <div class="flex mb-6">
            <a href="?role=member" class="flex-1 text-center py-2 {% if role == 'member' %}bg-blue-600 text-white{% else %}bg-gray-200{% endif %} rounded-l-lg">Member</a>
            <a href="?role=staf" class="flex-1 text-center py-2 {% if role == 'staf' %}bg-blue-600 text-white{% else %}bg-gray-200{% endif %} rounded-r-lg">Staf</a>
        </div>

        <form method="post" class="space-y-4">
            {% csrf_token %}
            <input type="hidden" name="role" value="{{ role }}">

            <div>
                <label class="block text-sm font-medium mb-1">Email *</label>
                <input type="email" name="email" class="w-full p-2 border rounded" required>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Password *</label>
                <input type="password" name="password1" class="w-full p-2 border rounded" required>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Confirm Password *</label>
                <input type="password" name="password2" class="w-full p-2 border rounded" required>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Salutation</label>
                <input type="text" name="salutation" class="w-full p-2 border rounded" placeholder="Mr/Mrs/Ms">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">First/Middle Name</label>
                <input type="text" name="first_mid_name" class="w-full p-2 border rounded">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Last Name *</label>
                <input type="text" name="last_name" class="w-full p-2 border rounded" required>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Country Code</label>
                <input type="text" name="country_code" class="w-full p-2 border rounded" placeholder="+62">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Phone Number</label>
                <input type="text" name="phone" class="w-full p-2 border rounded">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Nationality</label>
                <input type="text" name="nationality" class="w-full p-2 border rounded">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Birth Date</label>
                <input type="date" name="birth_date" class="w-full p-2 border rounded">
            </div>

            {% if role == 'staf' and airlines %}
            <div>
                <label class="block text-sm font-medium mb-1">Airline *</label>
                <select name="airline" class="w-full p-2 border rounded" required>
                    <option value="">Select Airline</option>
                    {% for airline in airlines %}
                    <option value="{{ airline.id }}">{{ airline.code }} - {{ airline.name }}</option>
                    {% endfor %}
                </select>
            </div>
            {% endif %}

            <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-lg hover:bg-green-700">Register</button>
        </form>

        <p class="text-center mt-6 text-gray-600">
            Already have an account? <a href="{% url 'login' %}" class="text-blue-600 hover:underline">Login</a>
        </p>
    </div>
</div>
{% endblock %}
