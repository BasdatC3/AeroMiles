{% extends 'base.html' %}

{% block title %}Welcome - AeroMiles{% endblock %}

{% block content %}
<div class="text-center py-16">
    <h1 class="text-5xl font-bold text-gray-800 mb-4">AeroMiles</h1>
    <p class="text-xl text-gray-600 mb-8">Earn Miles. Redeem Rewards. Fly Together.</p>

    <div class="flex justify-center gap-4">
        <a href="{% url 'login' %}" class="bg-blue-600 text-white px-8 py-3 rounded-lg hover:bg-blue-700 text-lg">Login</a>
        <a href="{% url 'register' %}?role=member" class="bg-green-600 text-white px-8 py-3 rounded-lg hover:bg-green-700 text-lg">Register Member</a>
        <a href="{% url 'register' %}?role=staf" class="bg-purple-600 text-white px-8 py-3 rounded-lg hover:bg-purple-700 text-lg">Register Staf</a>
    </div>
</div>
{% endblock %}
