{% extends 'base.html' %}

{% block title %}Change Password - AeroMiles{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-16">
    <div class="bg-white p-8 rounded-lg shadow-lg">
        <h2 class="text-3xl font-bold text-center mb-8">Ubah Password</h2>

        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium mb-1">Password Lama</label>
                <input type="password" name="old_password" class="w-full p-2 border rounded" required>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Password Baru</label>
                <input type="password" name="new_password1" class="w-full p-2 border rounded" required>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Konfirmasi Password Baru</label>
                <input type="password" name="new_password2" class="w-full p-2 border rounded" required>
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700">Ubah Password</button>
        </form>

        <p class="text-center mt-6">
            <a href="{% url 'profile' %}" class="text-blue-600 hover:underline">Kembali ke Profil</a>
        </p>
    </div>
</div>
{% endblock %}
